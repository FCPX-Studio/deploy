# Redis for the event streams (see the events repo README, "Redis on the VPS").
# The password is set with --requirepass from env/redis.env (see docker-compose.yml).

# Only reachable on the compose "backend" network: no port is published on the host
bind 0.0.0.0
protected-mode yes
port 6379

# Streams are the queue: they must survive a restart
dir /data
appendonly yes
appendfsync everysec

# Never evict stream data. When maxmemory is reached, writes fail instead
# (publishers raise, and EventsAPI answers Paddle with a 5xx so Paddle retries).
maxmemory 256mb
maxmemory-policy noeviction
