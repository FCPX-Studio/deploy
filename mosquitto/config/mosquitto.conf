# Mosquitto: the services publish their logs here (logger package), the ESP32 reads them.
#
# Secrets live in mosquitto/secrets/ on the VPS only (gitignored, excluded from the deploy rsync):
#   passwd             accounts, managed by mosquitto/passwd.sh
#   cert.pem, key.pem  Let's Encrypt certificate of mqtt.<SITE_ADDRESS>, copied from Caddy by mosquitto/sync-certs.sh

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Every client logs in, and only does what the ACL allows (applies to both listeners)
per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# Internal: the services, on the Docker `backend` network. Not published on the host
listener 1883

# Public: TLS only (the ESP32). Published on the host's port 8883
listener 8883
certfile /mosquitto/secrets/cert.pem
keyfile /mosquitto/secrets/key.pem
tls_version tlsv1.2

# Logs are small; a client that falls behind loses messages instead of filling the memory
max_queued_messages 1000
max_packet_size 16384
