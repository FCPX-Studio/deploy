# FCPX Studio stack on the VPS.
#
#   docker compose pull && docker compose up -d
#
# Image tags and SITE_ADDRESS come from .env (see .env.example).
# Each service reads its own settings from env/<service>.env (see env/*.env.example).
#
# Start order: postgres -> db-migrate (applies migrations, exits) -> services.
# Services in the "pending" profile have no published image yet: remove their
# `profiles` line once the image exists on GHCR.

name: fcpx

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Shared by every application service
x-app: &app
  <<: *logging
  restart: unless-stopped
  networks:
    - backend
  depends_on:
    db-migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- edge

  # Public entrypoint: HTTPS with Let's Encrypt certificates (see Caddyfile)
  caddy:
    <<: *logging
    image: caddy:2.10
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    # The host's resolver (systemd-resolved, 127.0.0.53) is unreachable from
    # inside the container, so use public resolvers to reach Let's Encrypt.
    dns:
      - 213.186.33.99 # OVH
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Must persist: holds certificates and ACME account (avoids rate limits)
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  # ---------------------------------------------------------------- data

  postgres:
    <<: *logging
    image: postgres:17
    restart: unless-stopped
    env_file: env/postgres.env
    # Loopback only: reachable from the VPS itself (SSH tunnel, e.g. TablePlus),
    # never from the internet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty data volume: creates the services' role
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    <<: *logging
    image: redis:7.4
    restart: unless-stopped
    env_file: env/redis.env
    # redis.conf can't read env vars, so the password is passed on the command line
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # One-shot: applies the shared db migrations (alembic upgrade head), then exits.
  # A no-op when the schema is already up to date. Built from the db repo.
  db-migrate:
    <<: *logging
    image: ghcr.io/fcpx-studio/db-migrate:${DB_MIGRATE_TAG:?set DB_MIGRATE_TAG in .env}
    restart: "no"
    env_file: env/db-migrate.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------- services

  auth-api:
    <<: *app
    image: ghcr.io/fcpx-studio/auth-api:${AUTH_API_TAG:-latest}
    env_file: env/auth-api.env
    # Stable Redis consumer name (orders:ready) across restarts. Remove if running >1 replica
    hostname: auth-api
    # Plain HTTP on 8000, only reachable by Caddy (no published ports)
    networks:
      - backend
      - web

  # Public product catalog for the website. Postgres only, as a read-only role that can see the
  # catalog tables only (no Redis: it starts without waiting for it)
  data-api:
    <<: *logging
    restart: unless-stopped
    image: ghcr.io/fcpx-studio/data-api:${DATA_API_TAG:-latest}
    env_file: env/data-api.env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    # Plain HTTP on 8000, only reachable by Caddy (no published ports)
    networks:
      - backend
      - web

  # Paddle webhooks -> Redis streams, SSE to the website. Redis only (no Postgres)
  event-api:
    <<: *app
    image: ghcr.io/fcpx-studio/event-api:${EVENT_API_TAG:-latest}
    env_file: env/event-api.env
    # Plain HTTP on 8000, only reachable by Caddy (no published ports)
    networks:
      - backend
      - web

  # Workers: no HTTP, only Redis + Postgres

  # Redis paddle:events consumer -> Postgres. No healthcheck: a crash exits
  # non-zero, `restart: unless-stopped` (from x-app) brings it back, and
  # unacked events are retried from Redis.
  paddlesync:
    <<: *app
    image: ghcr.io/fcpx-studio/paddlesync:${PADDLESYNC_TAG:-latest}
    env_file: env/paddlesync.env
    # Stable Redis consumer name across restarts. Remove if running >1 replica
    hostname: paddlesync

  emailtalker:
    <<: *app
    profiles: ["pending"]
    image: ghcr.io/fcpx-studio/emailtalker:${EMAILTALKER_TAG:-latest}
    env_file: env/emailtalker.env

networks:
  # Caddy <-> public APIs
  web:
  # Services <-> Postgres / Redis (no public port; Postgres only on the VPS loopback)
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
