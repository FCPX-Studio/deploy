name: Deploy

# Every push to main uploads the stack files to the VPS and restarts what changed.
# Services deploy themselves: each service repo's workflow restarts only its
# own container after pushing a new image.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml with the example env files
        run: |
          cp .env.example .env
          for f in env/*.env.example; do cp "$f" "${f%.example}"; done
          sed -i 's/^SITE_ADDRESS=$/SITE_ADDRESS=example.com/' .env
          docker compose config --quiet
          docker compose --profile pending config --quiet

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # VPS_* come from this repo's production environment secrets, or from the
    # organization secrets when the environment doesn't define them
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Secrets (.env, env/*.env) only live on the VPS: excluded files are
      # neither uploaded nor deleted by --delete
      - name: Upload stack files to ~/deploy
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'env/*.env' \
            ./ "$VPS_USER@$VPS_HOST:deploy/"

      # flock: waits for any other deploy on the VPS (service repos) to finish,
      # so two `docker compose up` never recreate a container at once.
      # The lock file lives outside ~/deploy, which rsync --delete manages.
      - name: Pull images and restart
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            exec 9> ~/.deploy.lock
            flock -w 600 9
            cd deploy
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
          '
